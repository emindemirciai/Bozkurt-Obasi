name: Web checks, containers and release

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Require a newer version for main
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$RELEASE_BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            node scripts/release-version.mjs check
          else
            node scripts/release-version.mjs check --base "$RELEASE_BASE_SHA"
          fi
      - name: Reproducible install
        run: npm ci --no-audit --no-fund
      - name: Source, translations, and deployment checks
        run: npm run check
      - name: Source formatting
        run: npm run format:check
      - name: Engine and API tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Standalone landing preview
        run: npm run build:preview
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: Browser gameplay checks
        run: npm run test:e2e
      - name: Count source lines
        run: npm run count:lines -- --no-write --json
      - name: Clean source archive
        run: npm run backup
      - uses: actions/upload-artifact@v4
        with:
          name: Bozkurt-Obasi-web-delivery
          path: |
            artifacts/*.zip
            artifacts/*.sha256
            preview/index.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-details
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  backup:
    name: Windows full-backup checks
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify full backups with disposable repositories
        shell: powershell
        run: ./scripts/test-backup.ps1

  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: |
          docker compose -f compose.yml config --quiet
          docker compose -f docker-compose.yml config --quiet
          node scripts/compose-env-smoke.mjs
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: bozkurt-obasi:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container health and sign-in gate smoke
        run: node scripts/container-smoke.mjs bozkurt-obasi:ci

      - name: Build all Dokploy services
        run: docker compose -f compose.yml -f compose.local.yml build
      - name: Gateways recover from API replacement
        run: node scripts/proxy-smoke.mjs
      - name: Analytics authentication handles upstream failures
        run: node scripts/analyze-auth-smoke.mjs
      - name: Four-service auth and analytics smoke
        env:
          ADMIN_BOOTSTRAP_PASSWORD: ci-only-test-password-2026
        run: |
          docker compose -f compose.yml -f compose.local.yml up -d --no-build
          node scripts/stack-smoke.mjs
      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose -f compose.yml -f compose.local.yml down -v

  release:
    name: Publish version tag and bilingual release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [checks, container, backup]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Extract this version's TR/EN changelog
        run: node scripts/release-notes.mjs --output artifacts/release-notes.md
      - uses: actions/download-artifact@v4
        with:
          name: Bozkurt-Obasi-web-delivery
          path: release-assets
      - name: Publish verified source, preview and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs --assets release-assets --notes artifacts/release-notes.md
