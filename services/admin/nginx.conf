map $http_x_forwarded_proto $external_scheme {
  default $scheme;
  ~^https(?:,|$) https;
  ~^http(?:,|$) http;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Refresh Docker DNS when the API is recreated; static pages can start without the API.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 3s;
  set $api_upstream http://api:3000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  location /api/ {
    client_max_body_size 32k;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_connect_timeout 5s;
    proxy_read_timeout 20s;
  }

  location = / {
    try_files /index.html =404;
  }

  location / {
    try_files $uri =404;
  }
}
