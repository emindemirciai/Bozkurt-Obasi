map $http_x_forwarded_proto $external_scheme {
  default $scheme;
  ~^https(?:,|$) https;
  ~^http(?:,|$) http;
}

server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control "no-store" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; font-src 'self'; connect-src 'self' https://analiz.bozkurtobasi.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # 2 MB photo bytes become about 2.8 MB in JSON/base64. All other API bodies remain 32 KB.
  location = /api/player/profile {
    client_max_body_size 3m;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_read_timeout 20s;
  }

  location /api/ {
    client_max_body_size 32k;
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $external_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection '';
    proxy_read_timeout 20s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
