name: bozkurt-obasi

services:
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DATABASE_PATH: /data/game.sqlite
      TRUST_PROXY: "true"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-info@bozkurtobasi.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ANALYZE_ENABLED: "${ANALYZE_ENABLED:-true}"
      ANALYZE_URL: "${ANALYZE_URL:-https://analiz.bozkurtobasi.com}"
      ANALYZE_SITE_ID: "${ANALYZE_SITE_ID:-bozkurtobasi.com}"
      ANALYZE_ALLOWED_ORIGINS: "${ANALYZE_ALLOWED_ORIGINS:-https://bozkurtobasi.com,https://www.bozkurtobasi.com}"
    expose:
      - "3000"
    volumes:
      - game-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  admin:
    build:
      context: .
      dockerfile: services/admin/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  analyze:
    build:
      context: ./services/analyze
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ANALYZE_SITE_ID: "${ANALYZE_SITE_ID:-bozkurtobasi.com}"
      ANALYZE_SITE_NAME: "${ANALYZE_SITE_NAME:-Bozkurtobasi.com}"
      ANALYZE_TITLE_TR: "${ANALYZE_TITLE_TR:-Bozkurtobasi.com Siteni Analiz Et}"
      ANALYZE_TITLE_EN: "${ANALYZE_TITLE_EN:-Bozkurtobasi.com Analyze Your Site}"
      ANALYZE_METADATA_TITLE: "${ANALYZE_METADATA_TITLE:-Bozkurtobasi.com Siteni Analiz Et | Trafik Paneli}"
      ANALYZE_DESCRIPTION: "${ANALYZE_DESCRIPTION:-Bozkurtobasi.com için gerçek zamanlı trafik analiz paneli}"
      ANALYZE_HEALTH_NAME: "${ANALYZE_HEALTH_NAME:-Bozkurtobasi.com Siteni Analiz Et}"
      ANALYZE_AUTH_MODE: platform-admin
      ANALYZE_AUTH_API_URL: "${ANALYZE_AUTH_API_URL:-https://api.bozkurtobasi.com}"
      ANALYZE_ALLOWED_ORIGINS: "${ANALYZE_ALLOWED_ORIGINS:-https://bozkurtobasi.com,https://www.bozkurtobasi.com}"
      ANALYZE_EVENT_SITES: "${ANALYZE_EVENT_SITES:-bozkurtobasi.com,www.bozkurtobasi.com}"
      ANALYZE_DATA_DIR: /app/data
      ANALYZE_MAX_EVENTS: "${ANALYZE_MAX_EVENTS:-200000}"
      ANALYZE_GEO_LOOKUP: "${ANALYZE_GEO_LOOKUP:-true}"
    expose:
      - "3000"
    volumes:
      - analyze-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5
    deploy:
      replicas: 1

volumes:
  game-data:
  analyze-data:
