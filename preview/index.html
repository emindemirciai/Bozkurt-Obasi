-29`,changes:{tr:[`Koyu tema ana sayfa, oyun, yönetim ve analiz ekranlarında sıcak kahverengi ve toprak tonlarına taşındı; vurgu alanlarında bozkır yeşili kullanılıyor.`,`Krem metinler, altın vurgular ve uyumlu kart, düğme, bildirim ve pencere renkleriyle okunabilirlik iyileştirildi; açık tema ve ana görsel ölçüleri korundu.`],en:[`Dark mode now uses warm brown and earth tones across the homepage, game, admin and analytics screens, with steppe green accents.`,`Cream text, gold highlights and coordinated cards, buttons, notices and dialogs improve readability; light mode and hero image dimensions remain unchanged.`]}},{version:`1.2.4`,date:`2026-09-28`,changes:{tr:[`Ana sayfa görselinde beş muhafız kurt, obanın önünde sürüyü hilal düzeninde koruyacak şekilde yerleştirildi; yüzleri çakallara dönük kaldı.`,`Dağlar, göl, gün batımı ve oba arka planı korundu; görselin 1672×941 ölçüsü, TR/EN eşit boyutları ve ilk ekrandaki Google girişi değişmedi.`],en:[`Repositioned five guardian wolves in the homepage artwork into a crescent in front of the camp, protecting the herd and facing the jackals.`,`Preserved the mountains, lake, sunset and camp background; retained the 1672×941 artwork size, equal TR/EN layout and first-screen Google sign-in.`]}},{version:`1.2.3`,date:`2026-09-28`,changes:{tr:[`Ana sayfa, gizlilik ve koşullar sayfalarının alt bilgilerindeki MIT etiketi kaldırıldı; alt bilgi artık © 2026 Bozkurt Obası şeklindedir.`],en:[`Removed the MIT label from the homepage, privacy and terms page footers; the footer now reads © 2026 Bozkurt Obası.`]}},{version:`1.2.2`,date:`2026-09-28`,changes:{tr:[`main güncellemelerinde başarılı test ve dört servis kontrolünden sonra otomatik Git etiketi ve TR/EN GitHub Release yayını eklendi.`,`Sürümler temiz kaynak ZIP, SHA-256 ve görsel index.html ile teslim edilir; güncel sürüm README ve GitHub Releases bölümünde görünür.`,`Tek komutla sürüm kayıtlarını birlikte ilerleten araç, sürüm artışını zorunlu tutan CI kontrolü ve güvenli tekrar yayın desteği eklendi.`,`GitHub About açıklaması, site bağlantısı ve proje konuları eklendi; görünür sayfa alt bilgilerindeki kişi adı kaldırıldı.`,`Ana sayfa görseli TR/EN dil değişiminde aynı ölçüde kalır ve masaüstünde ilk ekrana sığar; sayfa sonundaki tekrarlanan Google girişi kaldırıldı.`],en:[`Added automatic Git tags and TR/EN GitHub Releases after successful tests and four-service checks on main updates.`,`Releases include a clean source ZIP, SHA-256 and visual index.html; the current version appears in README and GitHub Releases.`,`Added one-command version updates, a CI version-increase requirement and safe publishing retries.`,`Added the GitHub About description, website link and project topics; removed the personal name from visible page footers.`,`Homepage artwork keeps the same size across TR/EN and fits the first desktop screen; removed the repeated Google sign-in at the bottom of the page.`]}},{version:`1.2.1`,date:`2026-09-28`,changes:{tr:[`Ana sayfadaki oba görseli, görsel alanının tamamına yayılarak sahnenin bütünü görünür hale getirildi.`,`Üst menüdeki Obaya gir düğmesi kaldırıldı; köy ve diğer oyun ekranları Google oturumu açılmadan erişilemez oldu.`,`Google yapılandırılmadığında oyun erişimi kapalı tutulur; çevrimdışı index yalnızca görsel ana sayfa önizlemesi sunar.`,`Oyun API'sinde oturumsuz erişim engeli ve çıkış sırasında geciken yanıtlar test edildi; analiz oturum çözümlemesini bekler.`],en:[`Expanded the village artwork across the full hero area so the complete scene is visible.`,`Removed the header's village button and required a Google session for the village and all other game screens.`,`When Google is unconfigured, game access stays closed; the offline index offers a visual homepage preview only.`,`Tested unauthenticated game API denial and delayed responses after logout; analytics waits for session resolution.`]}},{version:`1.2.0`,date:`2026-09-27`,changes:{tr:[`Görselli ana sayfa, oba hikâyesi ve oyuna hızlı giriş eklendi.`,`Google ile güvenli giriş, sunucu köyünü hesaba bağlama ve cihazlar arası devam etme hazırlandı.`,`Türkçe/İngilizce gizlilik bildirimi ve kullanım koşulları eklendi.`,`Analiz konum sorgusundaki şifresiz HTTP yedeği kaldırıldı; Dokploy OAuth ayarları eklendi.`],en:[`Added a visual homepage, village story, and direct entry to the game.`,`Prepared secure Google sign-in, server-village account linking, and cross-device progress.`,`Added Turkish/English privacy notice and terms of use.`,`Removed the analytics geolocation plaintext HTTP fallback and added Dokploy OAuth settings.`]}},{version:`1.1.0`,date:`2026-09-26`,changes:{tr:[`Oyun, yönetim ve analiz ekranlarına açık/koyu tema seçimi eklendi.`,`Oyun içinde Türkçe ve İngilizce sürüm geçmişi açıldı; güncel sürüm arayüzde görünüyor.`,`Sayfa kaynağında telif sahibi ve MIT lisans bildirimi görünür hale getirildi.`,`Dört servisli Dokploy kurulumu için üretim ortamı örneği ve sürüm belgeleri güncellendi.`],en:[`Added light/dark theme selection to the game, admin, and analytics screens.`,`Added a Turkish/English release history in the game and displayed its current version.`,`Made the copyright holder and MIT license notice visible in page source.`,`Updated the production environment example and release documentation for the four-service Dokploy stack.`]}},{version:`1.0.0`,date:`2026-09-25`,changes:{tr:[`Köy kurma, üretim, muhafız ve sürü savunması içeren oynanabilir web sürümü yayınlandı.`,`Savaş sırasında kurt ve çakal hareketleri ile savaş başında rastgele gelen çakal taktikleri eklendi.`,`Tek Compose içinde web, API, yönetim ve kullanıcının Analyze Your Site kaynağından uyarlanan analiz servisleri hazırlandı.`,`Türkçe/İngilizce arayüz, çevrimdışı index, testler, MIT lisansı ve temiz kaynak yedeği eklendi.`],en:[`Released a playable browser village builder with production, guardians, and herd defense.`,`Added wolf and jackal combat motion and a randomly chosen jackal tactic at battle start.`,`Prepared web, API, admin, and analyt
