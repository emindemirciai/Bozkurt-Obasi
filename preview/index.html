un erişimi kapalı tutulur; çevrimdışı index yalnızca görsel ana sayfa önizlemesi sunar.`,`Oyun API'sinde oturumsuz erişim engeli ve çıkış sırasında geciken yanıtlar test edildi; analiz oturum çözümlemesini bekler.`],en:[`Expanded the village artwork across the full hero area so the complete scene is visible.`,`Removed the header's village button and required a Google session for the village and all other game screens.`,`When Google is unconfigured, game access stays closed; the offline index offers a visual homepage preview only.`,`Tested unauthenticated game API denial and delayed responses after logout; analytics waits for session resolution.`]}},{version:`1.2.0`,date:`2026-09-27`,changes:{tr:[`Görselli ana sayfa, oba hikâyesi ve oyuna hızlı giriş eklendi.`,`Google ile güvenli giriş, sunucu köyünü hesaba bağlama ve cihazlar arası devam etme hazırlandı.`,`Türkçe/İngilizce gizlilik bildirimi ve kullanım koşulları eklendi.`,`Analiz konum sorgusundaki şifresiz HTTP yedeği kaldırıldı; Dokploy OAuth ayarları eklendi.`],en:[`Added a visual homepage, village story, and direct entry to the game.`,`Prepared secure Google sign-in, server-village account linking, and cross-device progress.`,`Added Turkish/English privacy notice and terms of use.`,`Removed the analytics geolocation plaintext HTTP fallback and added Dokploy OAuth settings.`]}},{version:`1.1.0`,date:`2026-09-26`,changes:{tr:[`Oyun, yönetim ve analiz ekranlarına açık/koyu tema seçimi eklendi.`,`Oyun içinde Türkçe ve İngilizce sürüm geçmişi açıldı; güncel sürüm arayüzde görünüyor.`,`Sayfa kaynağında telif sahibi ve MIT lisans bildirimi görünür hale getirildi.`,`Dört servisli Dokploy kurulumu için üretim ortamı örneği ve sürüm belgeleri güncellendi.`],en:[`Added light/dark theme selection to the game, admin, and analytics screens.`,`Added a Turkish/English release history in the game and displayed its current version.`,`Made the copyright holder and MIT license notice visible in page source.`,`Updated the productio
